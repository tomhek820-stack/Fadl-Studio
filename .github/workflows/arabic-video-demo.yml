name: Arabic video pipeline
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install project dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install --upgrade pip
          python -m pip install edge-tts piper-tts==1.3.0
      - name: Build and export Arabic demo
        env:
          EDGE_TTS_VOICE: ar-SA-HamedNeural
        run: python3 scripts/build_demo.py
      - name: Upload MP4s and quality report
        uses: actions/upload-artifact@v4
        with:
          name: fadl-studio-arabic-demo
          path: |
            demo/output/final_9x16.mp4
            demo/output/final_16x9.mp4
            demo/quality-report.md
          if-no-files-found: error
          retention-days: 14
