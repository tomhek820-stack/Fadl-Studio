name: Motion Reel — 40s deterministic
on:
  push:
    branches: ["feature/arabic-video-pipeline"]
    paths:
      - "motion-reel/**"
      - ".github/workflows/motion-reel.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motion-reel-\${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install renderer
        working-directory: motion-reel
        run: npm install --no-audit --no-fund
      - name: Check renderer JavaScript syntax
        working-directory: motion-reel
        run: |
          node --check engine.js
          node --check render.mjs
          node --check verify.mjs
      - name: Render 1200 frames
        working-directory: motion-reel
        run: npm run render
      - name: Verify MP4 and write quality report
        working-directory: motion-reel
        run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: fadl-studio-motion-reel
          path: |
            motion-reel/output/reel.mp4
            motion-reel/QUALITY_REPORT.md
          if-no-files-found: error
          retention-days: 14
