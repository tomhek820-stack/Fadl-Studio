<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Reel Preview</title><link rel="stylesheet" href="./node_modules/@fontsource/alexandria/500.css"><link rel="stylesheet" href="./node_modules/@fontsource/alexandria/700.css"><link rel="stylesheet" href="./node_modules/@fontsource/alexandria/800.css"><style>*{box-sizing:border-box}body{margin:0;background:#17191d;color:#f6f2eb;font-family:Arial;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:22px}.app{width:min(100%,740px);display:grid;gap:16px}.screen{width:min(100%,405px);margin:auto;aspect-ratio:9/16;background:#F2EFE9;box-shadow:0 20px 80px #0008;border-radius:18px;overflow:hidden}.screen canvas{width:100%;height:100%;display:block}.controls{background:#252930;border:1px solid #3a3f47;border-radius:18px;padding:16px;display:grid;gap:12px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}button{background:#E0762A;color:white;border:0;border-radius:12px;padding:12px 20px;font-size:16px;font-weight:700}input{width:100%;accent-color:#E0762A}output{font-variant-numeric:tabular-nums}small{color:#b9b6af}</style></head><body><main class="app"><div class="screen"><canvas id="stage" width="1080" height="1920"></canvas></div><section class="controls"><div class="row"><button id="toggle">تشغيل</button><output id="time">00:00.00 / 00:40.00</output></div><input id="seek" type="range" min="0" max="1199" step="1" value="0"><div class="row"><small>اسحب لمعاينة أي إطار — الإطار نفسه يعطي النتيجة نفسها</small><output id="frame">0 / 1199</output></div></section></main><script type="module">import "./engine.js";const s=document.querySelector("#seek"),o=document.querySelector("#time"),f=document.querySelector("#frame"),b=document.querySelector("#toggle");let playing=false,timer;function show(n){let v=Math.max(0,Math.min(1199,+n)),t=v/30;window.setTime(t);s.value=v;f.value=v+" / 1199";o.value="00:"+String(Math.floor(t)).padStart(2,"0")+"."+String(Math.floor(t%1*100)).padStart(2,"0")+" / 00:40.00"}s.addEventListener("input",()=>show(s.value));b.addEventListener("click",()=>{playing=!playing;b.textContent=playing?"إيقاف":"تشغيل";if(playing)timer=setInterval(()=>show((+s.value+1)%1200),1000/30);else clearInterval(timer)});document.fonts.ready.then(()=>show(0));</script></body></html>
